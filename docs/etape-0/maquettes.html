<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanout — maquettes</title>
<style>
:root{
  --fond:#F6F2EA; --surface:#FFFFFF; --creux:#EEE8DC; --encre:#1B211F; --doux:#5A6360;
  --trait:#DDD5C6; --vert:#0E6B4E; --sur-vert:#FFFFFF; --vert-pale:#DCEFE6;
  --safran:#F2B33D; --safran-pale:#FCEFCF; --sur-safran:#3D2A00;
  --terre:#A63A24; --terre-pale:#F7E0DA; --bleu-pale:#DDE8F3; --bleu:#1F4E79;
}
:root[data-theme="dark"]{
  --fond:#111614; --surface:#1A211E; --creux:#232C28; --encre:#ECE7DD; --doux:#A5ADA9;
  --trait:#33403A; --vert:#4FC79C; --sur-vert:#08261B; --vert-pale:#173A2D;
  --safran:#F2B33D; --safran-pale:#3E3011; --sur-safran:#FBE3A8;
  --terre:#F08C76; --terre-pale:#45201A; --bleu-pale:#1C2E40; --bleu:#9CC4EA;
}
*{box-sizing:border-box;margin:0}
body{background:var(--creux);color:var(--encre);padding:16px;
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-size:15px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.outils{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block-end:16px}
.outils h1{font-size:18px;margin-inline-end:auto}
button{font:inherit;color:inherit;cursor:pointer}
.bascule{min-height:44px;padding:0 14px;border:1px solid var(--trait);background:var(--surface);border-radius:8px;font-weight:600}
.planche{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
figure{width:360px;max-width:100%}
figcaption{font-weight:600;margin-block-end:8px;color:var(--doux)}
.tel{background:var(--fond);border:1px solid var(--trait);border-radius:22px;overflow:hidden;
  height:700px;display:flex;flex-direction:column;position:relative}
.haut{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border-block-end:1px solid var(--trait)}
.haut b{font-size:16px;margin-inline-end:auto}
.lang{min-width:44px;min-height:36px;border:1px solid var(--trait);border-radius:8px;background:none;font-weight:600}
.corps{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-block-start:1px solid var(--trait);padding:6px 4px 8px}
.nav div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--doux);min-height:44px;justify-content:center}
.nav .ici{color:var(--vert);font-weight:700}
.nav i{width:20px;height:20px;border:2px solid currentColor;border-radius:5px;display:block}
.nav .scan i{width:46px;height:46px;border-radius:50%;background:var(--vert);border-color:var(--vert);margin-block-start:-22px;
  box-shadow:0 0 0 5px var(--surface)}
.chiffres{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:10px 12px}
.carte small{color:var(--doux);display:block}
.carte strong{font-size:20px;display:block}
.alerte{background:var(--safran-pale);border-color:var(--safran);color:var(--sur-safran)}
.alerte small{color:inherit}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--doux);font-weight:600}
.modules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modules .carte{padding:8px 10px}.modules strong{font-size:16px}
.etat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.etat::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.e-vert{background:var(--vert-pale);color:var(--vert)}
.e-safran{background:var(--safran-pale);color:var(--sur-safran)}
.e-safran::before{border-radius:0;transform:rotate(45deg)}
.e-bleu{background:var(--bleu-pale);color:var(--bleu)}
.e-bleu::before{background:none;border:2px solid currentColor}
.e-terre{background:var(--terre-pale);color:var(--terre)}
.e-terre::before{border-radius:0}
.barres{display:flex;align-items:flex-end;gap:6px;height:70px;margin-block-start:8px}
.barres span{flex:1;background:var(--vert);border-radius:3px 3px 0 0;opacity:.55}
.barres span:last-child{opacity:1}
.ligne{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;min-height:56px}
.ligne .g{flex:1;min-width:0}.ligne small{color:var(--doux);display:block}
.fleche{color:var(--doux);font-size:18px}
[dir="rtl"] .fleche{transform:scaleX(-1)}
.filtres{display:flex;gap:6px;overflow:auto}
.puce{white-space:nowrap;padding:8px 12px;border-radius:99px;border:1px solid var(--trait);background:var(--surface);font-size:13px}
.puce.on{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.principal{min-height:48px;border:0;border-radius:10px;background:var(--vert);color:var(--sur-vert);font-weight:700;font-size:16px;width:100%}
.second{min-height:44px;border:1px solid var(--trait);border-radius:10px;background:var(--surface);font-weight:600;flex:1}
.rang{display:flex;gap:8px}
.camera{flex:1;background:#0B0E0D;border-radius:12px;position:relative;display:grid;place-items:center;min-height:300px;color:#E8E4DA}
.cadre{width:70%;height:120px;border:3px solid #4FC79C;border-radius:10px;position:relative}
.cadre::after{content:"";position:absolute;inset-inline:8px;top:50%;height:2px;background:#F2B33D}
.camera p{position:absolute;bottom:12px;font-size:13px;text-align:center;padding:0 12px}
.torche{position:absolute;top:10px;inset-inline-end:10px;min-width:44px;min-height:44px;border-radius:50%;border:1px solid #556;background:#1A211E;color:#F2B33D;font-size:18px}
.papier{background:var(--surface);border:1px solid var(--trait);border-radius:6px;padding:14px;font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.papier h3{font-size:17px}
.deux{display:flex;justify-content:space-between;gap:10px}
.deux>div:last-child{text-align:end}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 2px;text-align:start;border-block-end:1px solid var(--trait)}
th{color:var(--doux);font-weight:600;font-size:11px}
td:last-child,th:last-child{text-align:end}
.totaux{margin-inline-start:auto;width:70%}
.totaux div{display:flex;justify-content:space-between;padding:2px 0}
.totaux .ttc{font-weight:700;font-size:15px;border-block-start:2px solid var(--encre);margin-block-start:4px;padding-block-start:4px}
.mention{color:var(--doux);font-size:11px}
.banniere{background:var(--vert);color:var(--sur-vert);border-radius:12px;padding:16px}
.banniere small{opacity:.9}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.produit{background:var(--surface);border:1px solid var(--trait);border-radius:10px;overflow:hidden;position:relative}
.photo{aspect-ratio:1;background:linear-gradient(135deg,var(--creux),var(--trait))}
.produit div.t{padding:8px 10px}
.produit s{color:var(--doux);font-size:12px}
.badge{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--safran);color:#3D2A00}
.badge.r{background:var(--encre);color:var(--fond)}
.rupture .photo{opacity:.45}
.pied{padding:10px 16px;background:var(--surface);border-block-start:1px solid var(--trait)}
.note{max-width:760px;margin:20px auto 0;color:var(--doux);font-size:13px}
</style>
</head>

<script>
var racine=document.documentElement, langue='fr';
function appliquer(){
  racine.lang=langue; racine.dir=langue==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-fr]').forEach(function(e){e.textContent=e.getAttribute('data-'+langue).replace(/(\d) (?=\d)/g,'$1\u00A0')});
  document.getElementById('bLang').textContent=langue==='ar'?'Français':'العربية';
}
function changerLangue(){langue=langue==='fr'?'ar':'fr';appliquer()}
document.getElementById('bLang').onclick=changerLangue;
document.querySelectorAll('.lang').forEach(function(b){b.onclick=changerLangue});
document.getElementById('bTheme').onclick=function(){
  racine.dataset.theme=racine.dataset.theme==='dark'?'light':'dark';
};
appliquer();
</script>
